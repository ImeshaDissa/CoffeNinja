services:
  postgres:
    image: postgres:16-alpine
    container_name: coffee_ninja_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_dev_password
      POSTGRES_DB: coffee_ninja
    ports:
      - "5432:5432"
    volumes:
      - coffee_ninja_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d coffee_ninja"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  coffee_ninja_pgdata:

